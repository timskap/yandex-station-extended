pcm.airplay_hw {
  type dmix
  ipc_key 1396790066
  ipc_key_add_uid false
  ipc_perm 0600
  slave {
    pcm { type hw; card 0; device 0; }
    rate 48000
    format S16_LE
    channels 2
    period_size 960
    buffer_size 7680
  }
  bindings { 0 0; 1 1; }
}
pcm.!default {
  type softvol
  slave.pcm "airplay_hw"
  control { name "Master Playback Volume"; card 0; }
}
ctl.!default { type hw; card 0; }
ctl.hw {
  @args [ CARD ]
  @args.CARD { type string; }
  type hw
  card $CARD
}
timer.hw {
  @args [ CLASS SCLASS CARD DEV SUBDEV ]
  @args.CLASS { type integer; }
  @args.SCLASS { type integer; }
  @args.CARD { type string; }
  @args.DEV { type integer; }
  @args.SUBDEV { type integer; }
  type hw
  class $CLASS
  sclass $SCLASS
  card $CARD
  device $DEV
  subdevice $SUBDEV
}
