<busconfig>
  <type>system</type>
  <listen>unix:path=/tmp/shairport/bus</listen>
  <auth>EXTERNAL</auth>
  <policy context="default"><deny user="*"/><allow user="root"/></policy>
  <policy user="root">
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>
</busconfig>
