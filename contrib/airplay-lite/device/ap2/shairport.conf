general = {
  name = "Yandex Station Lite";
  service_type = "airplay2";
  port = 7000;
  output_backend = "alsa";
  mdns_backend = "avahi";
  playback_mode = "mono";
  default_airplay_volume = -24.0;
};
sessioncontrol = {
  wait_for_completion = "yes";
  active_state_timeout = 2.0;
  run_this_before_entering_active_state = "/data/shairport/ap2/on_play.sh";
  run_this_after_exiting_active_state = "/data/shairport/ap2/on_stop.sh";
};
alsa = {
  output_device = "default";
  output_rate = 48000;
  output_format = "S16_LE";
  output_channels = 2;
  disable_standby_mode = "never";
  use_precision_timing = "no";
};
metadata = { enabled = "no"; };
diagnostics = { log_verbosity = 1; };
